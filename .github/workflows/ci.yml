# Lint, build and test on push or PR to main
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Prebuilt OpenCV 4.12 image maintained by the gocv project (matches gocv v0.42)
    container: ghcr.io/hybridgroup/opencv:4.12.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -d cmd internal && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Build
        run: make build

      - name: Test
        run: go test -race -count=1 ./...
