# Build and publish a release when a version tag (vX.Y.Z) is pushed
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    container: ghcr.io/hybridgroup/opencv:4.12.0
    permissions:
      contents: write # create releases
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 ./...

      - name: Build and package
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/package.sh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.tar.gz
          generate_release_notes: true
          body: |
            **Platform:** Linux (amd64). The binary links dynamically against
            OpenCV 4.12 and needs ONNX Runtime and v4l2loopback at runtime;
            see the README for setup.

  # Adds the deck plugin and its index to the same release, so the repository works as a
  # deckd plugin source: https://github.com/amir-the-h/virtual-cameraman
  deck-plugin:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package deck plugin
        run: integrations/deckd/pack.sh

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/deckd/*.streamDeckPlugin
            build/deckd/index.json
