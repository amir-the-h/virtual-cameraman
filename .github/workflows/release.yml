# Build and publish a release when a version tag (vX.Y.Z) is pushed
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    container: ghcr.io/hybridgroup/opencv:4.12.0
    permissions:
      contents: write # create releases
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 ./...

      - name: Build and package
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/package.sh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.tar.gz
          generate_release_notes: true
          body: |
            **Platform:** Linux (amd64). The binary links dynamically against
            OpenCV 4.12 and needs ONNX Runtime and v4l2loopback at runtime;
            see the README for setup.
