<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144">
    <!-- Camera body -->
    <rect x="30" y="50" width="84" height="60" rx="8" fill="#2d2d2d" stroke="#0e6fb8"
        stroke-width="3" />

    <!-- Lens -->
    <circle cx="72" cy="80" r="22" fill="#1a1a1a" stroke="#0e6fb8" stroke-width="3" />
    <circle cx="72" cy="80" r="16" fill="#0e6fb8" opacity="0.3" />
    <circle cx="72" cy="80" r="10" fill="#0e6fb8" />

    <!-- Viewfinder -->
    <rect x="96" y="55" width="12" height="8" rx="2" fill="#0e6fb8" opacity="0.6" />

    <!-- Record button (top) -->
    <circle cx="50" cy="58" r="4" fill="#666" />

    <!-- Title -->
    <text x="72" y="130" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="14" fill="#0e6fb8" font-weight="bold">CAMERA</text>
</svg>